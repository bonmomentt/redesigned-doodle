<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

:root[data-theme="dark"]{--bg:#141a28;--card:#1d2536;--ink:#e8eefc;--sub:#8e9bb8;--line:#2a3550;--ok:#3fcf9a;--warn:#ffb83d;--full:#ff7a7a;--btn:#6b9aff;--btntx:#fff;--accent:#8db0ff;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 12px}

.bar b{font-size:17px}
.bar button{width:40px;height:40px;font-size:18px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;padding:8px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.add{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.add button{background:var(--btn);color:var(--btntx);border-color:var(--btn)}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.top{display:flex;align-items:baseline;gap:8px}
.name{font-weight:600;word-break:break-all;flex:1;min-width:0}
.msg{font-size:12px;color:var(--sub);white-space:nowrap}
.item.f .msg{color:var(--full);font-weight:600}
.cnt{font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.dots{display:flex;gap:5px;flex:1;min-width:0}
.dot{min-width:20px;height:20px;padding:0 5px;border-radius:10px;border:2px solid var(--line);font-size:11px;line-height:16px;color:#fff;text-align:center;white-space:nowrap}
.dot.on{cursor:pointer}
.dot.on{background:var(--ok);border-color:var(--ok)}

.ctl button{width:36px;height:32px;font-size:18px;padding:0;line-height:1}
.ctl{display:flex;gap:6px}
.ctl .plus{background:var(--btn);color:var(--btntx);border-color:var(--btn)}
.ctl button:disabled{opacity:.35;cursor:not-allowed}
.del{border:none;background:none;color:var(--sub);padding:4px 6px;font-size:12px}
.empty{color:var(--sub);text-align:center;padding:32px 0}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:16px}
body{background:linear-gradient(180deg,#e6f1ff 0%,#f6f0ff 60%,#fff6f0 100%);background-attachment:fixed;min-height:100vh}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
h1{text-align:center;font-size:26px;letter-spacing:1px;font-family:"Jua","Baloo 2","Pretendard","Apple SD Gothic Neo",sans-serif;background:linear-gradient(90deg,#5b8def,#a46bf0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:-.3px}
.bar{background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.bar b{color:var(--accent)}
.bar button{border:none;background:#eaf1ff;color:var(--accent);border-radius:10px;font-weight:700}
input{border-radius:12px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
input:focus{border-color:var(--accent);outline:none}
.add button{border-radius:12px;font-weight:700;box-shadow:var(--shadow)}
.item{border:none;border-radius:14px;box-shadow:var(--shadow);border-left:5px solid var(--ok)}
.item.w{border-left-color:var(--warn)}
.item.f{border-left-color:var(--full);background:linear-gradient(90deg,#fff1f1,var(--card) 40%)}
.dot{border-color:#dbe6f6;background:#f3f7fd}
.dot.on{font-weight:700}
.msg{background:#f1f5fc;border-radius:8px;padding:1px 8px}
.item.f .msg{background:#ffe4e4}
.cnt{color:var(--accent)}
.ctl button{border-radius:10px;border:none;background:#eaf1ff;color:var(--accent);font-weight:700}
.ctl .plus{background:var(--btn);color:#fff;box-shadow:0 2px 6px rgba(91,141,239,.35)}
.del{color:#b4c0d4}

<script>
const MAX=4,KEY="clientCounter.v1";
let data={clients:[],counts:{}}; // counts["YYYY-MM"][name]=n
let cur=new Date();cur.setDate(1);
try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
const sortC=()=>data.clients.sort((a,b)=>a.localeCompare(b,"ko",{numeric:true}));
sortC();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const mk=()=>cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0");
Object.values(data.counts).forEach(m=>{for(const n in m){if(typeof m[n]==="number")m[n]=Array(m[n]).fill(0)}});
function arr(n){const k=mk();data.counts[k]=data.counts[k]||{};return data.counts[k][n]=data.counts[k][n]||[]}
function get(n){return arr(n).length}
function save2(){save();render()}
function dlg(t,o){o=o||{};return new Promise(res=>{const v=document.createElement("div");v.className="ov";v.innerHTML='<div class="dlg"><p>'+t+'</p>'+(o.input?'<input type="number" inputmode="numeric" min="1" max="31" value="'+(o.def||"")+'">':"")+'<div class="dbtn"><button class="c">취소</button><button class="o">확인</button></div></div>';document.body.appendChild(v);const iv=v.querySelector("input");if(iv){iv.focus();iv.select()}const done=x=>{v.remove();res(x)};v.querySelector(".c").onclick=()=>done(null);v.querySelector(".o").onclick=()=>done(o.input?iv.value:true);v.addEventListener("click",e=>{if(e.target===v)done(null)});if(iv)iv.addEventListener("keydown",e=>{if(e.key==="Enter")done(iv.value)})})}
async function askDay(def){const v=await dlg("일자를 입력하세요 (1~31)",{input:true,def:def});if(v===null)return null;const d=parseInt(v,10);return d>=1&&d<=31?d:null}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  document.getElementById("month").textContent=cur.getFullYear()+"년 "+(cur.getMonth()+1)+"월";
  const el=document.getElementById("list");
  if(!data.clients.length){el.innerHTML='<div class="empty">거래처를 추가해 주세요.</div>';return}
  el.innerHTML=data.clients.map((n,i)=>{
    const c=get(n),cls=c>=MAX?"f":c===MAX-1?"w":"";
    const msg=c>=MAX?"한도 도달":"남은 "+(MAX-c)+"회";
    return `<div class="item ${cls}"><div class="top"><span class="name">${esc(n)}</span><span class="msg">${msg}</span><span class="cnt">${c}/${MAX}</span></div>
    <div class="row"><div class="dots">${[0,1,2,3].map(k=>k<c?`<span class="dot on" data-e="${i}:${k}">${arr(n)[k]?arr(n)[k]+"일":"✓"}</span>`:`<span class="dot"></span>`).join("")}</div>
    <div class="ctl"><button data-m="${i}" aria-label="1회 취소" ${c<=0?"disabled":""}>−</button><button class="plus" data-p="${i}" aria-label="1회 추가" ${c>=MAX?"disabled":""}>+</button></div>
    <button class="del" data-d="${i}" aria-label="삭제">삭제</button></div></div>`}).join("");
}
document.getElementById("list").addEventListener("click",async e=>{
  const d=e.target.closest("[data-e]");
  if(d){const [i,k]=d.dataset.e.split(":").map(Number),a=arr(data.clients[i]);const v=await askDay(a[k]||"");if(v){a[k]=v;save2()}return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.p!==undefined){const n=data.clients[+b.dataset.p],a=arr(n);if(a.length>=MAX)return;
    const now=new Date(),same=now.getFullYear()===cur.getFullYear()&&now.getMonth()===cur.getMonth();
    const day=same?now.getDate():await askDay("");if(!day)return;a.push(day);save2()}
  else if(b.dataset.m!==undefined){arr(data.clients[+b.dataset.m]).pop();save2()}
  else if(b.dataset.d!==undefined){const i=+b.dataset.d,n=data.clients[i];if(await dlg(esc(n)+" 거래처를 삭제할까요?<br><small>모든 달의 기록이 지워집니다.</small>")){data.clients.splice(i,1);Object.values(data.counts).forEach(m=>delete m[n]);save();render()}}
});
function add(){
  const i=document.getElementById("newName"),n=i.value.trim();
  if(!n)return;
  if(data.clients.includes(n)){dlg("이미 있는 거래처입니다.");return}
  data.clients.push(n);sortC();i.value="";save();render();
}
document.getElementById("addBtn").onclick=add;
document.getElementById("newName").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
document.getElementById("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
document.getElementById("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
render();
</script>
</body>
</html>
